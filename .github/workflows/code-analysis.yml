name: "CodeQL Analysis"
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  schedule:
    - cron: '0 0 * * *'
jobs:
  analyze-code:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
      pull-requests: write
    
    env:
      GOPRIVATE: "github.com/onflow, github.com/axiomzen"
     # ORG_READER_PAT: ${{ secrets.ORG_READER_PAT }}
     # ORG_READER_USERNAME: ${{ secrets.ORG_READER_USERNAME }}

    strategy:
      fail-fast: false
      matrix:
        languages: ['go']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
            go-version-file: ./go.mod

     # - name: set credentials for private repos
     #   run: rm -f ~/.gitconfig && git config --global url.https://$ORG_READER_USERNAME:$ORG_READER_PAT@github.com/.insteadOf https://github.com/ && cat ~/.gitconfig

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.languages}}
          queries: security-extended

      # onflow/crypto v0.27.2 removed `no_cgo.go`,
      # the pure-Go stub that allowed a build with cgo disabled,
      # so the BLS and secp256k1 symbols now only exist in the cgo files.
      # The build must therefore enable cgo, like every other build of this project.
      # It must also resolve modules from the module cache instead of `vendor/`,
      # because `go mod vendor` does not copy the C headers that blst needs.
      - name: Build
        run: CGO_ENABLED=1 CGO_CFLAGS="-O2 -D__BLST_PORTABLE__ -std=gnu11" go build ./...

      - name: CodeQL Analyze 
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.languages}}"
          # need org username and pat to access private libraries